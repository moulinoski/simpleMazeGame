<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Maze Game</title>
  <style>
    @import url("displays/base.css");
    @import url("displays/title.css");
    @import url("displays/loading-screen.css");
    @import url("displays/canvas.css");
    @import url("displays/win-overlay.css");
  </style>
</head>

<body>

  <div id="app-title" style="display: none;">Simple Maze Game</div>

  <div id="start-screen">
    <div id="title-card">SIMPLE MAZE GAME<br>Can <u>you</u> escape the maze?</div>
    <div id="start-menu" role="menu">
      <button class="menu-btn highlighted" data-index="0" role="menuitem">Tiny</button>
      <button class="menu-btn" data-index="1" role="menuitem">Small</button>
      <button class="menu-btn" data-index="2" role="menuitem">Medium</button>
      <button class="menu-btn" data-index="3" role="menuitem">Large</button>
      <button class="menu-btn" data-index="4" role="menuitem">Giant</button>
    </div>
  </div>

  <div id="loading-screen" style="display: none;">
    <div id="loading-label">Generating maze…</div>
    <div id="loading-bar-track">
      <div id="loading-bar-fill"></div>
    </div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="maze-canvas"></canvas>
    <div id="hint">Arrow keys / W A S D to move &nbsp;·&nbsp; Reach ✨ to win</div>
  </div>

  <div id="win-overlay">
    <div id="win-card">
      <div id="win-text">You Win!</div>
      <button id="play-again-btn">Play Again?</button>
    </div>
  </div>

  <script src="cells/Cell.js"></script>
  <script src="cells/Impassable.js"></script>
  <script src="cells/Passable.js"></script>
  <script src="cells/BasicImpassable.js"></script>
  <script src="cells/BasicPassable.js"></script>
  <script src="cells/GreenImpassable.js"></script>
  <script src="cells/VolcanoImpassable.js"></script>
  <script src="cells/StoneImpassable.js"></script>
  <script src="cells/TreeImpassable.js"></script>
  <script src="mazes/Maze.js"></script>
  <script src="mazes/TinyMaze.js"></script>
  <script src="mazes/SmallMaze.js"></script>
  <script src="mazes/MediumMaze.js"></script>
  <script src="mazes/LargeMaze.js"></script>
  <script src="mazes/GiantMaze.js"></script>
  <script src="algorithms/MazeSolver.js"></script>
  <script src="algorithms/MazeGenerator.js"></script>

  <!-- ================================================================ -->
  <!--  Simple Maze Game                                                -->
  <!--  TypeScript-style architecture compiled to ES2020+ JavaScript    -->
  <!-- ================================================================ -->

  <!-- Display Handlers -->
  <script src="game/renderer.js"></script>

  <!-- Game Logic -->
  <script src="game/inputHandling.js"></script>
  <script src="game/gameState.js"></script>
  <script src="game/domRefs.js"></script>
  <script src="game/gameLoop.js"></script>
  <script src="game/startup.js"></script>
  <script src="game/asyncGeneration.js"></script>
  <script src="game/startScreenAndMenuHandling.js"></script>
</body>

</html>
